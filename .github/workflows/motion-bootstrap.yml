name: Observatory Motion Bootstrap

on:
  push:
    branches: [design/tailwind-hybrid-observatory]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/tailwind-hybrid-observatory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Execute TDD migration and verification
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/observatory-motion-bootstrap.log) 2>&1

          python3 scripts/apply-observatory-motion.py tests
          npm --prefix frontend install

          set +e
          npm --prefix frontend run test -- --watch=false > /tmp/observatory-motion-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/observatory-motion-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "Expected motion policy tests to fail before implementation."
            exit 1
          fi
          grep -Eq "motion-policy|Cannot find module|TS2307" /tmp/observatory-motion-red.log

          python3 scripts/apply-observatory-motion.py implementation
          npm --prefix frontend run test -- --watch=false
          npm --prefix frontend run build
          git diff --check

      - name: Commit verified motion system
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: orchestrate observatory motion with AutoAnimate and GSAP"
          git pull --rebase origin design/tailwind-hybrid-observatory
          git push origin HEAD:design/tailwind-hybrid-observatory

      - name: Record migration failure evidence
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          mkdir -p docs/diagnostics
          {
            echo '# Observatory motion bootstrap failure'
            echo
            echo '```text'
            tail -n 500 /tmp/observatory-motion-bootstrap.log 2>/dev/null || true
            echo '```'
          } > docs/diagnostics/observatory-motion-bootstrap-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/observatory-motion-bootstrap-failure.md
          git commit -m "test: record observatory motion bootstrap failure"
          git pull --rebase origin design/tailwind-hybrid-observatory
          git push origin HEAD:design/tailwind-hybrid-observatory
