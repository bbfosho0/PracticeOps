name: Observatory Motion Bootstrap

on:
  push:
    branches: [design/tailwind-hybrid-observatory]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/tailwind-hybrid-observatory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add dependencies and failing motion-policy tests
        run: python3 scripts/apply-observatory-motion.py tests

      - name: Install runtime motion dependencies and update lockfile
        working-directory: frontend
        run: npm install

      - name: Verify motion-policy tests fail before implementation
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test -- --watch=false > /tmp/observatory-motion-red.log 2>&1
          status=$?
          set -e
          cat /tmp/observatory-motion-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected motion policy tests to fail before implementation."
            exit 1
          fi
          grep -Eq "motion-policy|Cannot find module|TS2307" /tmp/observatory-motion-red.log

      - name: Apply AutoAnimate and GSAP implementation
        run: python3 scripts/apply-observatory-motion.py implementation

      - name: Run complete frontend test suite
        working-directory: frontend
        run: npm run test -- --watch=false

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Check generated diff
        run: git diff --check

      - name: Commit verified motion system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: orchestrate observatory motion with AutoAnimate and GSAP"
          git push origin HEAD:design/tailwind-hybrid-observatory
