name: Observatory Motion Migration

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/apply-observatory-motion.py'
      - '.github/workflows/motion-bootstrap.yml'
      - '.github/workflows/motion-pr-bootstrap.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.event.pull_request.head.ref == 'design/tailwind-hybrid-observatory' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/tailwind-hybrid-observatory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add dependencies and failing motion-policy tests
        run: python3 scripts/apply-observatory-motion.py tests

      - name: Install motion dependencies and update lockfile
        run: npm --prefix frontend install

      - name: Verify the motion policy test fails before implementation
        shell: bash
        run: |
          set +e
          npm --prefix frontend run test -- --watch=false > /tmp/observatory-motion-red.log 2>&1
          status=$?
          set -e
          cat /tmp/observatory-motion-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected motion policy tests to fail before implementation."
            exit 1
          fi
          grep -Eq "motion-policy|Cannot find module|TS2307" /tmp/observatory-motion-red.log

      - name: Apply AutoAnimate and GSAP integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/visual-audit.yml')
          text = path.read_text(encoding='utf-8')
          current = "              assert(state.dataView === view.id, `Expected data-view ${view.id}, received ${state.dataView}`);\n            };"
          normalized = "            assert(state.dataView === view.id, `Expected data-view ${view.id}, received ${state.dataView}`);\n          };"
          if current in text:
              path.write_text(text.replace(current, normalized, 1), encoding='utf-8')
          PY
          python3 scripts/apply-observatory-motion.py implementation
          cat > frontend/src/auto-animate.directive.ts <<'TS'
          import { AfterViewInit, Directive, ElementRef, NgZone, OnDestroy } from '@angular/core';
          import autoAnimate from '@formkit/auto-animate';

          @Directive({
            selector: '[auto-animate]',
            standalone: true
          })
          export class AutoAnimateDirective implements AfterViewInit, OnDestroy {
            private controller?: { disable(): void };

            constructor(
              private readonly element: ElementRef<HTMLElement>,
              private readonly zone: NgZone
            ) {}

            ngAfterViewInit(): void {
              this.zone.runOutsideAngular(() => {
                this.controller = autoAnimate(this.element.nativeElement);
              });
            }

            ngOnDestroy(): void {
              this.controller?.disable();
            }
          }
          TS
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/app.component.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { AutoAnimateDirective } from '@formkit/auto-animate/angular';",
              "import { AutoAnimateDirective } from './auto-animate.directive';"
          )
          path.write_text(text, encoding='utf-8')
          PY
          git checkout -- .github/workflows/visual-audit.yml .github/workflows/motion-bootstrap.yml .github/workflows/motion-pr-bootstrap.yml
          rm -f docs/diagnostics/observatory-motion-bootstrap-failure.md

      - name: Run complete frontend test suite
        run: npm --prefix frontend run test -- --watch=false

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Validate generated diff
        run: git diff --check

      - name: Commit verified motion system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: orchestrate observatory motion with AutoAnimate and GSAP"
          git pull --rebase origin design/tailwind-hybrid-observatory
          git push origin HEAD:design/tailwind-hybrid-observatory
