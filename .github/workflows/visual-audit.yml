name: Visual Audit

on:
  push:
    branches:
      - fix/functional-telemetry-layout
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/visual-audit.yml'

jobs:
  functional-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test -- --watch=false
      - run: npm run build

      - name: Serve production build
        run: |
          python3 -m http.server 4173 --directory dist/practiceops/browser > /tmp/practiceops-server.log 2>&1 &
          echo $! > /tmp/practiceops-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/practiceops-server.log
          exit 1

      - name: Exercise telemetry, controls, and layouts
        run: |
          mkdir -p visual-audit
          cat > /tmp/practiceops-functional-audit.mjs <<'NODE'
          import { spawn } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const chrome = spawn('google-chrome', [
            '--headless=new',
            '--no-sandbox',
            '--disable-gpu',
            '--hide-scrollbars',
            '--force-device-scale-factor=1',
            '--remote-debugging-port=9222',
            '--user-data-dir=/tmp/practiceops-functional-chrome',
            '--window-size=1600,1000',
            'about:blank'
          ], { stdio: 'ignore' });

          try {
            let version;
            for (let attempt = 0; attempt < 50; attempt += 1) {
              try {
                version = await fetch('http://127.0.0.1:9222/json/version').then(response => response.json());
                break;
              } catch {
                await sleep(200);
              }
            }
            if (!version) throw new Error('Chrome DevTools endpoint did not start.');

            const target = await fetch('http://127.0.0.1:9222/json/new?http://127.0.0.1:4173/', { method: 'PUT' }).then(response => response.json());
            const socket = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              socket.addEventListener('open', resolve, { once: true });
              socket.addEventListener('error', reject, { once: true });
            });

            let requestId = 0;
            const pending = new Map();
            const consoleMessages = [];
            socket.addEventListener('message', event => {
              const message = JSON.parse(event.data);
              if (message.id && pending.has(message.id)) {
                const { resolve, reject } = pending.get(message.id);
                pending.delete(message.id);
                if (message.error) reject(new Error(message.error.message));
                else resolve(message.result);
              }
              if (message.method === 'Runtime.consoleAPICalled') {
                consoleMessages.push({
                  type: message.params.type,
                  values: message.params.args.map(argument => argument.value ?? argument.description ?? '')
                });
              }
              if (message.method === 'Runtime.exceptionThrown') {
                consoleMessages.push({ type: 'exception', values: [message.params.exceptionDetails.text] });
              }
            });

            const send = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++requestId;
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });

            const evaluate = async expression => {
              const response = await send('Runtime.evaluate', {
                expression,
                awaitPromise: true,
                returnByValue: true
              });
              if (response.exceptionDetails) {
                throw new Error(response.exceptionDetails.exception?.description ?? response.exceptionDetails.text);
              }
              return response.result.value;
            };

            const screenshot = async fileName => {
              const response = await send('Page.captureScreenshot', {
                format: 'png',
                captureBeyondViewport: false,
                fromSurface: true
              });
              await writeFile(`visual-audit/${fileName}`, Buffer.from(response.data, 'base64'));
            };

            const waitFor = async selector => {
              for (let attempt = 0; attempt < 50; attempt += 1) {
                if (await evaluate(`Boolean(document.querySelector(${JSON.stringify(selector)}))`)) return;
                await sleep(120);
              }
              throw new Error(`Timed out waiting for ${selector}`);
            };

            const click = async (selector, index = 0) => {
              const clicked = await evaluate(`(() => {
                const element = document.querySelectorAll(${JSON.stringify(selector)})[${index}];
                if (!element) return false;
                element.click();
                return true;
              })()`);
              assert(clicked, `Could not click ${selector} at index ${index}`);
              await sleep(300);
            };

            const selectValue = async (selector, value) => {
              const changed = await evaluate(`(() => {
                const element = document.querySelector(${JSON.stringify(selector)});
                if (!element) return false;
                element.value = ${JSON.stringify(value)};
                element.dispatchEvent(new Event('change', { bubbles: true }));
                return true;
              })()`);
              assert(changed, `Could not set ${selector}`);
              await sleep(300);
            };

            const inputValue = async (selector, value) => {
              const changed = await evaluate(`(() => {
                const element = document.querySelector(${JSON.stringify(selector)});
                if (!element) return false;
                element.value = ${JSON.stringify(value)};
                element.dispatchEvent(new Event('input', { bubbles: true }));
                return true;
              })()`);
              assert(changed, `Could not input ${selector}`);
              await sleep(300);
            };

            const layoutCheck = async (name, selectors) => {
              const result = await evaluate(`(() => {
                const selectors = ${JSON.stringify(selectors)};
                const items = selectors.map(selector => {
                  const element = document.querySelector(selector);
                  if (!element) return { selector, missing: true };
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return {
                    selector,
                    missing: false,
                    rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height, right: rect.right, bottom: rect.bottom },
                    display: style.display,
                    visibility: style.visibility,
                    opacity: Number(style.opacity)
                  };
                });
                const visible = items.filter(item => !item.missing && item.display !== 'none' && item.visibility !== 'hidden' && item.opacity > 0 && item.rect.width > 1 && item.rect.height > 1);
                const overlaps = [];
                for (let left = 0; left < visible.length; left += 1) {
                  for (let right = left + 1; right < visible.length; right += 1) {
                    const a = visible[left].rect;
                    const b = visible[right].rect;
                    const width = Math.min(a.right, b.right) - Math.max(a.x, b.x);
                    const height = Math.min(a.bottom, b.bottom) - Math.max(a.y, b.y);
                    if (width > 3 && height > 3) overlaps.push([visible[left].selector, visible[right].selector, width, height]);
                  }
                }
                return {
                  name: ${JSON.stringify(name)},
                  viewport: { width: innerWidth, height: innerHeight },
                  documentWidth: document.documentElement.scrollWidth,
                  items,
                  overlaps
                };
              })()`);
              const missing = result.items.filter(item => item.missing).map(item => item.selector);
              assert(missing.length === 0, `${name} missing selectors: ${missing.join(', ')}`);
              assert(result.documentWidth <= result.viewport.width + 2, `${name} has horizontal document overflow: ${result.documentWidth} > ${result.viewport.width}`);
              assert(result.overlaps.length === 0, `${name} has overlapping primary panels: ${JSON.stringify(result.overlaps)}`);
              return result;
            };

            const viewDefinitions = [
              { index: 0, id: 'overview', title: 'Operations observatory', selectors: ['.schedule-preview', '.documentation-preview', '.risk-preview', '.activity-preview'] },
              { index: 1, id: 'schedule', title: 'Temporal runway', selectors: ['.runway-panel', '.schedule-side'] },
              { index: 2, id: 'documentation', title: 'Documentation continuum', selectors: ['.continuum-panel', '.note-queue', '.backlog-panel', '.bottleneck-panel', '.followup-panel'] },
              { index: 3, id: 'claims', title: 'Risk constellation', selectors: ['.exposure-card', '.constellation-panel', '.trend-panel', '.distribution-panel', '.payer-panel', '.claim-actions-panel', '.claims-table-panel'] },
              { index: 4, id: 'audit', title: 'Event spectrum', selectors: ['.spectrum-panel', '.event-types-panel', '.activity-table-panel'] },
              { index: 5, id: 'settings', title: 'Workspace parameters', selectors: ['.demo-boundary', '.workspace-profile', '.preference-panel', '.role-panel', '.integrations-panel', '.system-panel'] }
            ];

            const selectWorkspace = async definition => {
              await click('.dock-item', definition.index);
              const state = await evaluate(`(() => ({
                title: document.querySelector('h1')?.textContent?.trim(),
                activeLabel: document.querySelector('.dock-item[aria-current="page"]')?.getAttribute('aria-label'),
                dataView: document.querySelector('.observatory')?.getAttribute('data-view')
              }))()`);
              assert(state.title === definition.title, `Expected ${definition.title}, received ${state.title}`);
              assert(state.dataView === definition.id, `Expected data-view ${definition.id}, received ${state.dataView}`);
              return state;
            };

            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride', { width: 1600, height: 1000, deviceScaleFactor: 1, mobile: false });
            await send('Page.navigate', { url: 'http://127.0.0.1:4173/' });
            await waitFor('.metric-signal');
            await sleep(900);

            const evidence = { desktop: {}, mobile: {}, interactions: {}, kpis: null };
            const kpis = await evaluate(`[...document.querySelectorAll('.metric-signal')].map(item => ({
              label: item.querySelector('.metric-copy > span')?.textContent?.trim(),
              value: item.querySelector('strong')?.textContent?.trim(),
              detail: item.querySelector('small')?.textContent?.trim()
            }))`);
            assert(JSON.stringify(kpis.map(item => item.value)) === JSON.stringify(['24', '7', '12', '86%']), `KPI values did not reconcile: ${JSON.stringify(kpis)}`);
            assert(kpis[2].detail.includes('$54.3k'), `Claim exposure detail is stale: ${kpis[2].detail}`);
            evidence.kpis = kpis;

            for (const definition of viewDefinitions) {
              evidence.desktop[definition.id] = await selectWorkspace(definition);
              evidence.desktop[definition.id].layout = await layoutCheck(`${definition.id}-desktop`, definition.selectors);
              await screenshot(`${definition.id}-desktop.png`);
            }

            await selectWorkspace(viewDefinitions[1]);
            await click('.segmented-control button', 1);
            assert(await evaluate(`document.querySelector('.schedule-workspace')?.getAttribute('data-mode')`) === 'week', 'Week mode did not activate.');
            assert(await evaluate(`Boolean(document.querySelector('.week-panel'))`), 'Week mode did not render its panel.');
            evidence.interactions.weekMode = true;

            await click('.segmented-control button', 2);
            assert(await evaluate(`document.querySelector('.schedule-workspace')?.getAttribute('data-mode')`) === 'list', 'List mode did not activate.');
            assert(await evaluate(`Boolean(document.querySelector('.list-panel'))`), 'List mode did not render its panel.');
            evidence.interactions.listMode = true;

            await click('.segmented-control button', 0);
            const providerValue = await evaluate(`document.querySelector('select[aria-label="Filter by provider"] option:nth-child(2)')?.value`);
            assert(Boolean(providerValue), 'Provider filter has no data options.');
            await selectValue('select[aria-label="Filter by provider"]', providerValue);
            const filteredAppointments = await evaluate(`document.querySelectorAll('.appointment-block').length`);
            assert(filteredAppointments > 0 && filteredAppointments < 24, `Provider filter did not change the runway: ${filteredAppointments}`);
            evidence.interactions.providerFilter = { providerValue, filteredAppointments };
            await selectValue('select[aria-label="Filter by provider"]', 'all');

            const initialDate = await evaluate(`document.querySelector('.date-control span')?.textContent?.trim()`);
            await click('button[aria-label="Next day"]');
            const nextDate = await evaluate(`document.querySelector('.date-control span')?.textContent?.trim()`);
            assert(initialDate !== nextDate, 'Next-day control did not change the selected date.');
            assert(await evaluate(`Boolean(document.querySelector('.runway-panel .workspace-empty'))`), 'Empty schedule state did not render for a date without records.');
            await click('button[aria-label="Previous day"]');
            evidence.interactions.dateNavigation = { initialDate, nextDate };

            await selectWorkspace(viewDefinitions[3]);
            await selectValue('select[aria-label="Filter claims by payer"]', 'Aetna');
            const payerResults = await evaluate(`document.querySelectorAll('.claims-table .table-row:not(.table-head)').length`);
            assert(payerResults > 0 && payerResults < 8, `Payer filter did not narrow claims: ${payerResults}`);
            await inputValue('input[aria-label="Search claims"]', 'CLM-740103');
            const searchResults = await evaluate(`document.querySelectorAll('.claims-table .table-row:not(.table-head)').length`);
            assert(searchResults === 1, `Claim search expected 1 result, received ${searchResults}`);
            evidence.interactions.claimFilters = { payerResults, searchResults };
            await click('.distribution-panel .text-action');

            await selectWorkspace(viewDefinitions[5]);
            const beforeToggle = await evaluate(`document.querySelector('.preference-toggle')?.getAttribute('aria-checked')`);
            await click('.preference-toggle', 0);
            const afterToggle = await evaluate(`document.querySelector('.preference-toggle')?.getAttribute('aria-checked')`);
            assert(beforeToggle !== afterToggle, `Notification switch did not toggle: ${beforeToggle} -> ${afterToggle}`);
            evidence.interactions.notificationToggle = { beforeToggle, afterToggle };

            await send('Emulation.setDeviceMetricsOverride', { width: 390, height: 844, deviceScaleFactor: 1, mobile: true });
            await sleep(500);
            for (const definition of viewDefinitions) {
              evidence.mobile[definition.id] = await selectWorkspace(definition);
              const mobileLayout = await layoutCheck(`${definition.id}-mobile`, definition.selectors.slice(0, Math.min(2, definition.selectors.length)));
              evidence.mobile[definition.id].layout = mobileLayout;
              const navState = await evaluate(`(() => {
                const dock = document.querySelector('.command-dock');
                const items = [...document.querySelectorAll('.dock-item')];
                const rect = dock?.getBoundingClientRect();
                return { count: items.length, dockRight: rect?.right, viewport: innerWidth };
              })()`);
              assert(navState.count === 6, `Mobile dock has ${navState.count} destinations.`);
              assert(navState.dockRight <= navState.viewport + 2, `Mobile dock exceeds viewport: ${JSON.stringify(navState)}`);
              await screenshot(`${definition.id}-mobile.png`);
            }

            const relevantConsoleMessages = consoleMessages.filter(message => ['error', 'exception', 'assert'].includes(message.type));
            assert(relevantConsoleMessages.length === 0, `Browser console errors: ${JSON.stringify(relevantConsoleMessages)}`);
            await writeFile('visual-audit/functional.json', JSON.stringify(evidence, null, 2));
            await writeFile('visual-audit/console.json', JSON.stringify(consoleMessages, null, 2));
            socket.close();
          } finally {
            chrome.kill('SIGTERM');
          }
          NODE
          node /tmp/practiceops-functional-audit.mjs
          test -s visual-audit/functional.json
          test -s visual-audit/console.json
          for view in overview schedule documentation claims audit settings; do
            test -s "visual-audit/${view}-desktop.png"
            test -s "visual-audit/${view}-mobile.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clinical-observatory-functional-audit
          path: frontend/visual-audit/*
          if-no-files-found: error
          retention-days: 7
