name: Visual Audit

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/visual-audit.yml'

permissions:
  contents: read

concurrency:
  group: practiceops-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functional-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test -- --watch=false
      - run: npm run build

      - name: Serve production build
        run: |
          python3 -m http.server 4173 --directory dist/practiceops/browser > /tmp/practiceops-server.log 2>&1 &
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/practiceops-server.log
          exit 1

      - name: Exercise portfolio workspaces and responsive layouts
        run: |
          mkdir -p visual-audit
          cat > /tmp/practiceops-visual-audit.mjs <<'NODE'
          import { spawn } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const chrome = spawn('google-chrome', [
            '--headless=new',
            '--no-sandbox',
            '--disable-gpu',
            '--hide-scrollbars',
            '--force-device-scale-factor=1',
            '--remote-debugging-port=9222',
            '--user-data-dir=/tmp/practiceops-visual-chrome',
            '--window-size=1600,1000',
            'about:blank'
          ], { stdio: 'ignore' });

          try {
            let version;
            for (let attempt = 0; attempt < 50; attempt += 1) {
              try {
                version = await fetch('http://127.0.0.1:9222/json/version').then(response => response.json());
                break;
              } catch {
                await sleep(200);
              }
            }
            if (!version) throw new Error('Chrome DevTools endpoint did not start.');

            const target = await fetch('http://127.0.0.1:9222/json/new?http://127.0.0.1:4173/', { method: 'PUT' }).then(response => response.json());
            const socket = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              socket.addEventListener('open', resolve, { once: true });
              socket.addEventListener('error', reject, { once: true });
            });

            let requestId = 0;
            const pending = new Map();
            const consoleMessages = [];
            socket.addEventListener('message', event => {
              const message = JSON.parse(event.data);
              if (message.id && pending.has(message.id)) {
                const operation = pending.get(message.id);
                pending.delete(message.id);
                if (message.error) operation.reject(new Error(message.error.message));
                else operation.resolve(message.result);
              }
              if (message.method === 'Runtime.consoleAPICalled') {
                consoleMessages.push({
                  type: message.params.type,
                  values: message.params.args.map(argument => argument.value ?? argument.description ?? '')
                });
              }
              if (message.method === 'Runtime.exceptionThrown') {
                consoleMessages.push({ type: 'exception', values: [message.params.exceptionDetails.text] });
              }
            });

            const send = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++requestId;
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });

            const evaluate = async expression => {
              const response = await send('Runtime.evaluate', { expression, awaitPromise: true, returnByValue: true });
              if (response.exceptionDetails) throw new Error(response.exceptionDetails.exception?.description ?? response.exceptionDetails.text);
              return response.result.value;
            };

            const waitFor = async selector => {
              for (let attempt = 0; attempt < 60; attempt += 1) {
                if (await evaluate(`Boolean(document.querySelector(${JSON.stringify(selector)}))`)) return;
                await sleep(120);
              }
              throw new Error(`Timed out waiting for ${selector}`);
            };

            const click = async (selector, index = 0) => {
              const clicked = await evaluate(`(() => {
                const element = document.querySelectorAll(${JSON.stringify(selector)})[${index}];
                if (!element) return false;
                element.click();
                return true;
              })()`);
              assert(clicked, `Could not click ${selector} at index ${index}`);
              await sleep(250);
            };

            const setValue = async (selector, value, eventName) => {
              const changed = await evaluate(`(() => {
                const element = document.querySelector(${JSON.stringify(selector)});
                if (!element) return false;
                element.value = ${JSON.stringify(value)};
                element.dispatchEvent(new Event(${JSON.stringify(eventName)}, { bubbles: true }));
                return true;
              })()`);
              assert(changed, `Could not update ${selector}`);
              await sleep(250);
            };

            const screenshot = async fileName => {
              const response = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false, fromSurface: true });
              await writeFile(`visual-audit/${fileName}`, Buffer.from(response.data, 'base64'));
            };

            const assertLayout = async (name, selectors) => {
              const result = await evaluate(`(() => {
                const selectors = ${JSON.stringify(selectors)};
                const items = selectors.map(selector => {
                  const element = document.querySelector(selector);
                  if (!element) return { selector, missing: true };
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return { selector, missing: false, width: rect.width, height: rect.height, display: style.display, visibility: style.visibility };
                });
                return { viewport: innerWidth, documentWidth: document.documentElement.scrollWidth, items };
              })()`);
              const missing = result.items.filter(item => item.missing).map(item => item.selector);
              assert(missing.length === 0, `${name} missing selectors: ${missing.join(', ')}`);
              assert(result.items.every(item => item.missing || (item.width > 1 && item.height > 1 && item.display !== 'none' && item.visibility !== 'hidden')), `${name} contains a hidden primary surface.`);
              assert(result.documentWidth <= result.viewport + 2, `${name} has horizontal overflow: ${result.documentWidth} > ${result.viewport}`);
              return result;
            };

            const views = [
              { index: 0, id: 'overview', title: 'Operations observatory', selectors: ['.scenario-rail', '.schedule-preview', '.documentation-preview', '.risk-preview', '.activity-preview'] },
              { index: 1, id: 'schedule', title: 'Temporal runway', selectors: ['.runway-panel', '.schedule-side'] },
              { index: 2, id: 'documentation', title: 'Documentation continuum', selectors: ['.continuum-panel', '.note-queue', '.backlog-panel', '.bottleneck-panel', '.followup-panel'] },
              { index: 3, id: 'claims', title: 'Risk constellation', selectors: ['.exposure-card', '.constellation-panel', '.trend-panel', '.distribution-panel', '.payer-panel', '.claim-actions-panel', '.claims-table-panel'] },
              { index: 4, id: 'audit', title: 'Event spectrum', selectors: ['.spectrum-panel', '.event-types-panel', '.activity-table-panel'] },
              { index: 5, id: 'settings', title: 'System & Demo', selectors: ['.demo-boundary', '.workspace-profile', '.preference-panel', '.role-panel', '.integrations-panel', '.system-panel'] }
            ];

            const selectView = async view => {
              await click('.dock-item', view.index);
              const state = await evaluate(`(() => ({
                title: document.querySelector('h1')?.textContent?.trim(),
                dataView: document.querySelector('.observatory')?.getAttribute('data-view')
              }))()`);
              assert(state.title === view.title, `Expected ${view.title}, received ${state.title}`);
              assert(state.dataView === view.id, `Expected data-view ${view.id}, received ${state.dataView}`);
            };

            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride', { width: 1600, height: 1000, deviceScaleFactor: 1, mobile: false });
            await send('Page.navigate', { url: 'http://127.0.0.1:4173/' });
            await waitFor('.metric-signal');
            await sleep(900);

            const evidence = { desktop: {}, mobile: {}, interactions: {} };
            const kpis = await evaluate(`[...document.querySelectorAll('.metric-signal strong')].map(element => element.textContent?.trim())`);
            assert(JSON.stringify(kpis) === JSON.stringify(['24', '7', '12', '86%']), `KPI values did not reconcile: ${JSON.stringify(kpis)}`);
            assert(await evaluate(`document.querySelector('.observatory')?.getAttribute('data-api-mode')`) === 'demo', 'Static visual audit must enter explicit synthetic preview mode.');
            assert(await evaluate(`document.querySelector('.scenario-primary')?.disabled`) === true, 'Synthetic preview must disable persisted scenario actions.');
            assert((await evaluate(`document.querySelector('.mode-notice')?.textContent`)).includes('Synthetic preview'), 'Synthetic fallback notice is missing.');

            const polishState = await evaluate(`(() => {
              const focusTarget = document.querySelector('.refresh-control');
              focusTarget?.focus();
              const focusStyle = focusTarget ? getComputedStyle(focusTarget) : null;
              const kicker = document.querySelector('.panel-kicker');
              const primary = document.querySelector('.scenario-primary');
              return {
                focusOutline: focusStyle?.outlineStyle,
                focusShadow: focusStyle?.boxShadow,
                kickerSize: kicker ? parseFloat(getComputedStyle(kicker).fontSize) : 0,
                primaryHeight: primary?.getBoundingClientRect().height ?? 0
              };
            })()`);
            assert(polishState.kickerSize >= 10, `Operational microcopy is too small: ${JSON.stringify(polishState)}`);
            assert(polishState.primaryHeight >= 40, `Primary action target is too short: ${JSON.stringify(polishState)}`);
            assert(polishState.focusOutline !== 'none' || polishState.focusShadow !== 'none', `Keyboard focus is not visible: ${JSON.stringify(polishState)}`);

            for (const view of views) {
              await selectView(view);
              evidence.desktop[view.id] = await assertLayout(`${view.id}-desktop`, view.selectors);
              await screenshot(`${view.id}-desktop.png`);
            }

            await selectView(views[1]);
            await click('.segmented-control button', 1);
            assert(await evaluate(`Boolean(document.querySelector('.week-panel'))`), 'Week mode did not render.');
            await click('.segmented-control button', 2);
            assert(await evaluate(`Boolean(document.querySelector('.list-panel'))`), 'List mode did not render.');
            await click('.segmented-control button', 0);
            const provider = await evaluate(`document.querySelector('select[aria-label="Filter by provider"] option:nth-child(2)')?.value`);
            await setValue('select[aria-label="Filter by provider"]', provider, 'change');
            const filteredAppointments = await evaluate(`document.querySelectorAll('.appointment-block').length`);
            assert(filteredAppointments > 0 && filteredAppointments < 24, `Provider filter did not narrow the runway: ${filteredAppointments}`);
            evidence.interactions.providerFilter = filteredAppointments;

            await selectView(views[3]);
            await setValue('select[aria-label="Filter claims by payer"]', 'Aetna', 'change');
            await setValue('input[aria-label="Search claims"]', 'CLM-740103', 'input');
            const claimResults = await evaluate(`document.querySelectorAll('.claims-table .table-row:not(.table-head)').length`);
            assert(claimResults === 1, `Claim search expected one result, received ${claimResults}`);
            evidence.interactions.claimSearch = claimResults;

            await selectView(views[5]);
            const beforeToggle = await evaluate(`document.querySelector('.preference-toggle')?.getAttribute('aria-checked')`);
            await click('.preference-toggle');
            const afterToggle = await evaluate(`document.querySelector('.preference-toggle')?.getAttribute('aria-checked')`);
            assert(beforeToggle !== afterToggle, 'Browser-local preference did not toggle.');
            evidence.interactions.preferenceToggle = { beforeToggle, afterToggle };

            await send('Emulation.setDeviceMetricsOverride', { width: 390, height: 844, deviceScaleFactor: 1, mobile: true });
            await sleep(500);
            for (const view of views) {
              await selectView(view);
              evidence.mobile[view.id] = await assertLayout(`${view.id}-mobile`, view.selectors.slice(0, 2));
              const navCount = await evaluate(`document.querySelectorAll('.dock-item').length`);
              assert(navCount === 6, `Mobile navigation has ${navCount} destinations.`);
              if (view.id === 'overview') {
                const mobilePolish = await evaluate(`(() => {
                  const rail = document.querySelector('.scenario-rail');
                  const workspace = document.querySelector('.workspace');
                  return {
                    railHeight: rail?.getBoundingClientRect().height ?? 0,
                    workspacePaddingBottom: workspace ? parseFloat(getComputedStyle(workspace).paddingBottom) : 0
                  };
                })()`);
                assert(mobilePolish.railHeight < 360, `Mobile journey rail is too tall: ${JSON.stringify(mobilePolish)}`);
                assert(mobilePolish.workspacePaddingBottom >= 100, `Mobile navigation safe area is missing: ${JSON.stringify(mobilePolish)}`);
              }
              await screenshot(`${view.id}-mobile.png`);
            }

            const relevantConsoleMessages = consoleMessages.filter(message => ['error', 'exception', 'assert'].includes(message.type));
            assert(relevantConsoleMessages.length === 0, `Browser console errors: ${JSON.stringify(relevantConsoleMessages)}`);
            evidence.polish = polishState;
            await writeFile('visual-audit/functional.json', JSON.stringify(evidence, null, 2));
            await writeFile('visual-audit/console.json', JSON.stringify(consoleMessages, null, 2));
            socket.close();
          } finally {
            chrome.kill('SIGTERM');
          }
          NODE
          node /tmp/practiceops-visual-audit.mjs
          test -s visual-audit/functional.json
          test -s visual-audit/console.json
          for view in overview schedule documentation claims audit settings; do
            test -s "visual-audit/${view}-desktop.png"
            test -s "visual-audit/${view}-mobile.png"
          done

      - name: Upload visual diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: practiceops-portfolio-visual-audit
          path: frontend/visual-audit/*
          if-no-files-found: ignore
          retention-days: 7
