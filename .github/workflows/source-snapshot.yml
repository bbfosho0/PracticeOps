name: Source Snapshot

on:
  push:
    branches:
      - fix/functional-telemetry-layout

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: practiceops-source-snapshot
          path: |
            frontend/src
            backend/PracticeOps.Api
            backend/PracticeOps.Tests
            .github/workflows/visual-audit.yml
          if-no-files-found: error
          retention-days: 1
