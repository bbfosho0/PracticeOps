name: Apply Final Polish

on:
  push:
    branches:
      - feature/deployment-truthful-practiceops-mvp
    paths:
      - scripts/apply-final-polish.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-truthful-practiceops-mvp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply assertion-guarded refinements
        run: python scripts/apply-final-polish.py

      - name: Commit refined files and remove one-time applicator
        run: |
          rm scripts/apply-final-polish.py
          rm .github/workflows/apply-final-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: apply final audited portfolio polish"
          git push origin HEAD:feature/deployment-truthful-practiceops-mvp
