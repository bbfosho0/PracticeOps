name: Modernization Bootstrap

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/modernization-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/engineering-quality-modernization
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Storybook and Playwright
        working-directory: frontend
        run: |
          npm install --save-exact --legacy-peer-deps \
            @angular/animations@20.2.0 \
            @angular/platform-browser-dynamic@20.2.0
          npm install --save-dev --save-exact --legacy-peer-deps \
            @storybook/angular@9.0.15 \
            @storybook/addon-a11y@9.0.15 \
            @storybook/addon-essentials@9.0.15 \
            @storybook/test@9.0.15 \
            @playwright/test@1.55.0
          npm pkg set scripts.storybook="storybook dev -p 6006"
          npm pkg set scripts.build-storybook="storybook build"
          npm pkg set scripts.test:e2e="playwright test"

      - name: Create Storybook configuration
        run: |
          mkdir -p frontend/.storybook frontend/src/stories frontend/e2e
          cat > frontend/.storybook/main.ts <<'EOF'
          import type { StorybookConfig } from '@storybook/angular';

          const config: StorybookConfig = {
            stories: ['../src/**/*.stories.@(ts|mdx)'],
            addons: ['@storybook/addon-essentials', '@storybook/addon-a11y'],
            framework: {
              name: '@storybook/angular',
              options: {},
            },
            docs: { autodocs: true },
          };

          export default config;
          EOF

          cat > frontend/.storybook/preview.ts <<'EOF'
          import type { Preview } from '@storybook/angular';
          import '../src/styles.css';

          const preview: Preview = {
            parameters: {
              actions: { argTypesRegex: '^on[A-Z].*' },
              controls: {
                matchers: {
                  color: /(background|color)$/i,
                  date: /Date$/i,
                },
              },
              a11y: { test: 'error' },
              backgrounds: {
                default: 'observatory',
                values: [{ name: 'observatory', value: '#04060c' }],
              },
            },
          };

          export default preview;
          EOF

          cat > frontend/src/stories/clinical-observatory-foundations.stories.ts <<'EOF'
          import type { Meta, StoryObj } from '@storybook/angular';

          const meta: Meta = {
            title: 'PracticeOps/Clinical Observatory Foundations',
            tags: ['autodocs'],
            render: () => ({
              template: `
                <main style="min-height:100vh;padding:2rem;background:#04060c;color:#f5f7ff;font-family:Inter,system-ui,sans-serif">
                  <p style="margin:0;color:#19d9ff;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Component workshop</p>
                  <h1 style="margin:.75rem 0;font-size:40px">Clinical Observatory</h1>
                  <p style="max-width:60ch;color:#aeb9cf;line-height:1.6">Deterministic component states are developed here before integration into the six operational workspaces.</p>
                  <section aria-label="Runtime states" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:2rem">
                    <article style="padding:1rem;border:1px solid rgba(25,217,255,.35);border-radius:16px;background:#0d1727"><strong>Live API</strong><p style="color:#37e08b">Authoritative data</p></article>
                    <article style="padding:1rem;border:1px solid rgba(122,77,255,.35);border-radius:16px;background:#0d1727"><strong>Synthetic preview</strong><p style="color:#9f7cff">Clearly labeled fallback</p></article>
                    <article style="padding:1rem;border:1px solid rgba(255,176,32,.35);border-radius:16px;background:#0d1727"><strong>Stale snapshot</strong><p style="color:#ffb020">Last valid data retained</p></article>
                  </section>
                </main>
              `,
            }),
          };

          export default meta;
          type Story = StoryObj;
          export const RuntimeStateMatrix: Story = {};
          EOF

      - name: Create Playwright configuration and smoke tests
        run: |
          cat > frontend/playwright.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            timeout: 45_000,
            expect: { timeout: 10_000 },
            fullyParallel: false,
            retries: process.env.CI ? 2 : 0,
            reporter: process.env.CI ? [['list'], ['html', { outputFolder: 'playwright-report', open: 'never' }]] : 'list',
            use: {
              baseURL: 'http://127.0.0.1:4200',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
            webServer: {
              command: 'npm run start -- --host 127.0.0.1 --port 4200',
              url: 'http://127.0.0.1:4200',
              reuseExistingServer: !process.env.CI,
              timeout: 120_000,
            },
            projects: [
              { name: 'desktop', use: { ...devices['Desktop Chrome'], viewport: { width: 1440, height: 1000 } } },
              { name: 'tablet', use: { ...devices['Desktop Chrome'], viewport: { width: 900, height: 1100 } } },
              { name: 'mobile', use: { ...devices['Pixel 7'], viewport: { width: 390, height: 844 } } },
              { name: 'reduced-motion', use: { ...devices['Desktop Chrome'], viewport: { width: 1440, height: 1000 }, reducedMotion: 'reduce' } },
            ],
          });
          EOF

          cat > frontend/e2e/observatory-smoke.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          test('loads the observatory and exposes truthful runtime state', async ({ page }) => {
            await page.goto('/');
            await expect(page.getByRole('heading', { name: /operations observatory/i })).toBeVisible();
            await expect(page.getByText(/synthetic preview|live api|connecting/i).first()).toBeVisible();
          });

          test('does not overflow horizontally at the configured viewport', async ({ page }) => {
            await page.goto('/');
            const dimensions = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.clientWidth + 1);
          });
          EOF

      - name: Install Playwright browser and verify tooling
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run build-storybook
          npm run test:e2e

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modernization-bootstrap-artifacts
          path: |
            frontend/storybook-static
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Commit deterministic bootstrap output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/package.json frontend/package-lock.json frontend/.storybook frontend/src/stories frontend/playwright.config.ts frontend/e2e
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "test: add Storybook and Playwright foundations"
          git push origin HEAD:feat/engineering-quality-modernization
