name: CI

on:
  pull_request:
  push:
    branches: [main, feature/practiceops-mvp]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore PracticeOps.sln
      - run: dotnet build PracticeOps.sln --configuration Release --no-restore
      - run: dotnet test PracticeOps.sln --configuration Release --no-build
      - run: dotnet format PracticeOps.sln --verify-no-changes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run test -- --watch=false
      - run: npm run build
