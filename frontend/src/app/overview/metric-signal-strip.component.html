@for (metric of metrics(); track metric.label) {
  <article class="metric-signal" [attr.data-tone]="metric.tone">
    <span class="signal-orb" aria-hidden="true"><span></span></span>
    <div class="metric-copy">
      <span>{{ metric.label }}</span>
      <strong [appMetricValueMotion]="metric.value" [metricSuffix]="metric.suffix ?? ''">{{ metric.value | number:'1.0-0' }}{{ metric.suffix }}</strong>
      <small>{{ metric.detail }}</small>
    </div>
  </article>
}
