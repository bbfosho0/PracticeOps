<header class="panel-header"><span class="panel-kicker">Event spectrum</span><div><span class="live-label"><i></i>{{ apiMode() === 'live' ? 'Persisted snapshot' : 'Synthetic preview' }}</span><span class="text-action read-only-action">{{ updatedLabel() }}</span></div></header>
<div class="spectrum-chart">@for (height of bars(); track $index) { <span class="spectrum-bar" [attr.data-tone]="toneForIndex($index)" [style.height.%]="height"></span> }</div>
<div class="spectrum-axis"><span>Oldest</span><span>Audit sequence</span><span>Newest</span></div>
